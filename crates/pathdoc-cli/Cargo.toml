[package]
name = "pathdoc-cli"
description = "Command-line front end for pathdoc-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "pathdoc"
path = "src/main.rs"

[dependencies]
# Colour that survives Windows. anstream decides whether the destination can take
# ANSI, honours NO_COLOR and CLICOLOR, and turns on virtual terminal processing
# where that is needed â€” the unsafe for which sits in anstyle-wincon rather than
# here. It is already in the tree via clap, so it costs nothing extra.
anstream = "=1.0.0"
anstyle = "=1.0.14"
clap = { version = "=4.6.7", features = ["derive"] }
pathdoc-core = { path = "../pathdoc-core", features = ["serde"] }
serde_json = "=1.0.151"
