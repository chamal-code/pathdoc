[package]
name = "pathdoc-core"
description = "Read-only auditing of the Windows PATH: composition order, dead entries, and shadowed executables."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Optional on purpose. The data model is the GUI contract whether it travels as
# Rust types over a direct link or as JSON over a pipe, so the derives live here
# rather than being mirrored in the front end. A consumer that links the library
# and never serialises anything should not pay for serde, hence the feature.
serde = { version = "=1.0.229", features = ["derive"], optional = true }
# Chosen over the `windows` crate because every Reg* function there is an
# `unsafe fn`, which would put an `unsafe` block in this crate — forbidden at
# workspace level. winreg is a thin safe wrapper over `windows-sys` that keeps
# that unsafe in the dependency, exposes the value type through `RegValue.vtype`
# so REG_SZ and REG_EXPAND_SZ stay distinguishable, and returns values
# unexpanded, which is what the spec needs.
#
# Pinned exactly: this is the one place the tool reads privileged machine state,
# so the version is a deliberate decision rather than whatever resolves today.
winreg = { version = "=0.56.0", default-features = false }

[features]
# Serialisation of the report types, and with it the versioned JSON envelope.
serde = ["dep:serde"]
